name: OIT Verification

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  # ── Tier 1: Smoke tests ────────────────────────────────────────────────────
  # Runs on every push and PR. EditMode only — no GPU required.
  smoke-tests:
    name: "Tier 1 — Smoke (EditMode)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run EditMode smoke tests
        uses: game-ci/unity-test-runner@v4
        id: smoke
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.14f1
          testMode: EditMode
          testPathPattern: "OIT\\.Tests\\.EditMode"
          artifactsPath: artifacts/smoke

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: artifacts/smoke

  # ── Tier 2: Integration tests ──────────────────────────────────────────────
  # Gated on Tier 1. PlayMode — requires Unity player loop but no GPU runner.
  # Full expansion (all INT-* tests) happens after the v0.3-passes milestone.
  integration-tests:
    name: "Tier 2 — Integration (PlayMode)"
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run PlayMode integration tests
        uses: game-ci/unity-test-runner@v4
        id: integration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.14f1
          testMode: PlayMode
          testPathPattern: "OIT\\.Tests\\.PlayMode"
          artifactsPath: artifacts/integration

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: artifacts/integration

  # ── Tier 3: Nightly full suite ─────────────────────────────────────────────
  # Runs only on the nightly schedule or manual dispatch; requires a self-hosted
  # runner tagged [self-hosted, gpu]. Performance + visual tiers run here.
  # Expansion to include visual regression tests happens after v0.4-scene.
  nightly-full:
    name: "Tier 3 — Nightly (Performance + Visual)"
    runs-on: [self-hosted, gpu]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run nightly full test suite
        uses: game-ci/unity-test-runner@v4
        id: nightly
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.14f1
          testMode: PlayMode
          testPathPattern: "OIT\\.Tests\\.PlayMode|OIT\\.Tests\\.Performance"
          artifactsPath: artifacts/nightly

      - name: Upload nightly test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: artifacts/nightly
